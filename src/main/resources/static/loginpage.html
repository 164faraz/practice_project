<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin sign in | Easy Academy</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head>
<body class="academy-shell">
    <div class="app-frame">
        <header class="topbar">
        <a class="brand" href="/index.html">
            <span class="brand-mark">◆</span> Easy Academy
        </a>
        <div class="topbar-right">
            <a class="admin-link" href="/Registrationpage.html">← Student registration

            </a>
        </div>
        </header>
        <main class="login-layout">
            <section class="login-card">
                <div class="login-icon">♙</div>
                <p class="eyebrow">ADMINISTRATION</p>
                <h1>Welcome back</h1>
                <p class="lede">Sign in to manage student records.</p>
                <div id="login-alert" aria-live="polite"></div>
                <form id="login-form">
                    <label class="field">
                        <span>Username</span>
                        <input class="control" id="username" name="username" autocomplete="username" placeholder="Enter username" required>
                    </label>
                    <label class="field">
                        <span>Password</span>
                        <input class="control" id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
                    </label>
                    <button class="primary-button full-button" type="submit">Sign in <span aria-hidden="true">→</span>
                    </button>
                </form>
                <p class="login-hint">Demo credentials: <strong>Admin</strong> / <strong>Admin</strong></p>
            </section>
        
        </main>
    </div>
    <script src="/js/app.js" defer></script>
</body>
</html>
