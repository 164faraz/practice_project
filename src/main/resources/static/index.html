<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Student Management</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="/css/style.css">
</head>
	<body>
	<nav class="navbar navbar-dark bg-primary shadow-sm">
		<div class="container"><a class="navbar-brand fw-semibold" href="/">Student Management</a></div>
	</nav>
	<main class="container py-5">
		<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
			<div><h1 class="h2 mb-1">Students</h1><p class="text-secondary mb-0">View and manage student records.</p></div>
			<button id="add-student-button" class="btn btn-primary" type="button">Add student</button>
		</div>
		<div id="alert-area" aria-live="polite"></div>
		<section class="row g-2 mb-3" aria-label="Student list filters">
			<div class="col-md-7"><input id="search-input" class="form-control" type="search" placeholder="Search students" aria-label="Search students"></div>
			<div class="col-md-5"><input id="course-filter" class="form-control" type="search" placeholder="Filter by course" aria-label="Filter by course"></div>
		</section>
		<div class="card border-0 shadow-sm"><div class="table-responsive">
			<table class="table table-hover align-middle mb-0">
				<thead class="table-light"><tr><th scope="col">Roll No.</th><th scope="col">Name</th><th scope="col">Email</th><th scope="col">Course</th><th scope="col" class="text-end">Actions</th></tr></thead>
				<tbody id="student-list"><tr><td colspan="5" class="text-center text-secondary py-4">Loading students…</td></tr></tbody>
			</table>
		</div></div>
	</main>
	<div class="modal fade" id="student-modal" tabindex="-1" aria-labelledby="dialog-title" aria-hidden="true">
		<div class="modal-dialog"><div class="modal-content">
			<form id="student-form">
				<div class="modal-header"><h2 class="modal-title fs-5" id="dialog-title">Add student</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
				<div class="modal-body">
					<div class="mb-3" id="rollno-group"><label class="form-label" for="student-rollno">Roll number</label><input id="student-rollno" name="rollNo" type="number" min="1" class="form-control" required></div>
					<div class="mb-3"><label class="form-label" for="student-name">Name</label><input id="student-name" name="name" type="text" minlength="2" class="form-control" required></div>
					<div class="mb-3"><label class="form-label" for="student-email">Email</label><input id="student-email" name="email" type="email" class="form-control" required></div>
					<div><label class="form-label" for="student-course">Course</label><input id="student-course" name="course" type="text" class="form-control" required></div>
				</div>
				<div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button id="save-button" class="btn btn-primary" type="submit">Save student</button></div>
			</form>
		</div></div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/js/app.js" defer></script>
</body>
</html>
